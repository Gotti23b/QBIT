<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QBIT Browser</title>
<style>
:root{color-scheme:dark;font-family:Segoe UI,Arial,sans-serif;background:#07111f;color:#e8f4fa}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
#chrome{height:138px;background:#0a1724;border-bottom:1px solid #203847;display:flex;flex-direction:column;position:relative;z-index:10}
#tabs{height:40px;flex:0 0 40px;display:flex;align-items:end;gap:5px;padding:5px 9px 0;overflow-x:auto;overflow-y:hidden;background:#07111c;scrollbar-width:thin}
.tab{height:34px;min-width:105px;max-width:230px;flex:1 1 150px;display:flex;align-items:center;gap:8px;padding:0 10px;border:1px solid #233c4c;border-bottom:0;border-radius:10px 10px 0 0;background:#0d1d2b;color:#9bb5c2;cursor:pointer;font-size:12px;position:relative}
.tab.active{background:#142b3a;color:#e9fbff;border-color:#397084}.tab span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.tab button{border:0;background:transparent;color:#9bb5c2;cursor:pointer;padding:3px 6px;border-radius:6px;font-size:15px}.tab button:hover{background:#294656;color:white}.tab .favicon{width:15px;height:15px;flex:0 0 15px;object-fit:contain}.tab .loading{width:12px;height:12px;border:2px solid #3a5968;border-top-color:#6ce2e9;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.tab-add{width:31px;height:29px;flex:0 0 31px;border:0;border-radius:8px;background:#122b3a;color:#9cecf5;font-size:19px;cursor:pointer}.tab-add:hover{background:#1a4052}
#toolbar{height:58px;flex:0 0 58px;display:flex;align-items:center;gap:7px;padding:8px 12px}
.brand{display:flex;align-items:center;gap:8px;margin-right:5px;color:#9cecf5;font-size:12px;font-weight:800;letter-spacing:.1em;white-space:nowrap}
.mark{display:grid;place-items:center;width:30px;height:30px;border-radius:10px;background:#123b49;color:#78e4ee;font-size:16px;box-shadow:0 4px 18px #25b6c52a}
.tool{width:35px;height:35px;flex:0 0 35px;border:1px solid #2b4352;border-radius:10px;background:#122333;color:#d8edf4;font-size:17px;cursor:pointer;transition:.15s}.tool:hover{border-color:#5bd5e2;background:#173342}.tool:disabled{opacity:.3;cursor:default}.tool.active{border-color:#50cddd;color:#82eaf1;background:#153747}
#address-wrap{height:39px;min-width:80px;flex:1;display:flex;align-items:center;gap:9px;padding:0 11px;border:1px solid #2b4352;border-radius:12px;background:#07131f;transition:.15s}
#secure{color:#75d7bb;font-size:14px}#address{width:100%;height:100%;border:0;outline:0;background:transparent;color:#e8f4fa;font:13px Segoe UI,Arial,sans-serif}
#address-wrap:focus-within{border-color:#50cddd;box-shadow:0 0 0 3px #49c6d31b}#status{max-width:190px;overflow:hidden;color:#8da8b7;font-size:11px;text-overflow:ellipsis;white-space:nowrap}#status.ready{color:#7ce0bc}
#bookmarks{height:40px;flex:0 0 40px;display:flex;align-items:center;gap:6px;padding:0 13px;border-top:1px solid #172d3b;background:#0a1724;overflow:hidden}
.bookmark{height:27px;display:flex;align-items:center;gap:7px;padding:0 9px;border:1px solid transparent;border-radius:8px;background:transparent;color:#a9c2ce;font-size:11px;white-space:nowrap;cursor:pointer}.bookmark:hover{background:#142d3c;border-color:#29495b;color:#e9fbff}.bookmark .dot{width:7px;height:7px;border-radius:50%;background:#61d5df}.bookmark-sep{height:17px;width:1px;background:#28404d;margin:0 3px}
#findbar{position:absolute;right:15px;top:145px;display:none;align-items:center;gap:6px;padding:8px;background:#0b1b29;border:1px solid #36586a;border-radius:12px;box-shadow:0 12px 38px #0008;z-index:30}#findbar.open{display:flex}#findInput{width:220px;background:#07131f;color:#eaf8fc;border:1px solid #345265;border-radius:8px;padding:8px;outline:none}#findInput:focus{border-color:#5bd5e2}.find-btn{width:29px;height:29px;border:0;border-radius:7px;background:#173345;color:#dffbff;cursor:pointer}.find-count{font-size:10px;color:#8ca9b7;min-width:35px}
@media(max-width:900px){.brand span:last-child,#status{display:none}#toolbar{gap:5px;padding:7px}.tool{width:32px;flex-basis:32px}#bookmarks{gap:2px;padding:0 7px}.bookmark{padding:0 7px}}
@media(max-width:620px){.tab{min-width:70px;flex-basis:100px}.bookmark:nth-of-type(n+6){display:none}#findInput{width:145px}}
</style></head><body>
<header id="chrome"><div id="tabs"><button class="tab-add" id="newTab" title="Nueva pestaña (Ctrl+T)">+</button></div>
<div id="toolbar"><div class="brand"><div class="mark">Q</div><span>QBIT</span></div>
<button class="tool" id="back" title="Atrás (Alt+←)">‹</button><button class="tool" id="forward" title="Adelante (Alt+→)">›</button><button class="tool" id="reload" title="Recargar (Ctrl+R)">↻</button><button class="tool" id="home" title="Inicio">⌂</button>
<div id="address-wrap"><span id="secure">◉</span><input id="address" type="text" spellcheck="false" autocomplete="off" aria-label="Dirección o búsqueda" placeholder="Buscar en Google o escribir una dirección (Ctrl+L)"></div>
<button class="tool" id="bookmark" title="Guardar esta página">☆</button><button class="tool" id="find" title="Buscar en esta página (Ctrl+F)">⌕</button><button class="tool" id="go" title="Ir">➜</button><span id="status">Navegador listo</span></div>
<nav id="bookmarks"><button class="bookmark" data-url="https://www.google.com/"><span class="dot"></span>Google</button><button class="bookmark" data-url="https://www.youtube.com/"><span class="dot"></span>YouTube</button><button class="bookmark" data-url="https://chatgpt.com/"><span class="dot"></span>ChatGPT</button><button class="bookmark" data-url="https://gemini.google.com/"><span class="dot"></span>Gemini</button><button class="bookmark" data-url="https://github.com/"><span class="dot"></span>GitHub</button><span class="bookmark-sep"></span><button class="bookmark" id="manageBookmarks" title="Administrar favoritos">＋ Favoritos</button></nav></header>
<div id="findbar"><input id="findInput" placeholder="Buscar en la página" autocomplete="off"><span class="find-count" id="findCount"></span><button class="find-btn" id="findPrev" title="Anterior">↑</button><button class="find-btn" id="findNext" title="Siguiente">↓</button><button class="find-btn" id="findClose" title="Cerrar">×</button></div>
<script>
(()=>{const $=id=>document.getElementById(id),a=$("address"),s=$("status"),tabs=$("tabs"),findBar=$("findbar"),findInput=$("findInput");let lastState=null,findTimer=null;
function renderTabs(items){tabs.querySelectorAll(".tab").forEach(n=>n.remove());for(const t of items||[]){const b=document.createElement("div");b.className="tab"+(t.active?" active":"");b.title=t.title||"Nueva pestaña";b.addEventListener("click",()=>window.qbitBrowser.selectTab(t.id));b.addEventListener("auxclick",e=>{if(e.button===1){e.preventDefault();window.qbitBrowser.closeTab(t.id);}});if(t.loading){const spin=document.createElement("i");spin.className="loading";b.append(spin);}else if(t.favicon){const img=document.createElement("img");img.className="favicon";img.src=t.favicon;img.onerror=()=>img.remove();b.append(img);}const label=document.createElement("span");label.textContent=t.title||"Nueva pestaña";const close=document.createElement("button");close.textContent="×";close.title="Cerrar pestaña";close.addEventListener("click",e=>{e.stopPropagation();window.qbitBrowser.closeTab(t.id)});b.append(label,close);tabs.insertBefore(b,$("newTab"));}}
function state(x){if(!x)return;lastState=x;if(document.activeElement!==a)a.value=x.url==="qbit://home"||String(x.url||"").startsWith("data:text/html")?"":x.url||"";$("back").disabled=!x.canGoBack;$("forward").disabled=!x.canGoForward;$("reload").textContent=x.loading?"×":"↻";$("reload").title=x.loading?"Detener carga":"Recargar";$("secure").textContent=x.url==="qbit://home"?"Q":x.secure?"🔒":"ⓘ";$("secure").style.color=x.secure?"#75d7bb":"#d9b77b";s.textContent=x.loading?"Cargando…":x.provider?(x.provider+(x.aiReady?" · IA integrada":" · Preparando IA…")):(x.host||"Nueva pestaña");s.className=x.provider&&x.aiReady?"ready":"";$("bookmark").classList.toggle("active",isBookmarked(x.url));$("bookmark").textContent=isBookmarked(x.url)?"★":"☆";document.title=(x.title||"Nueva pestaña")+" — QBIT Browser";renderTabs(x.tabs);}
function go(){const value=a.value.trim();if(!value)return;window.qbitBrowser.navigate(value).catch(e=>{s.textContent=e?.message||"No se pudo abrir";});}
function isBookmarked(url){return getBookmarks().some(x=>x.url===url);}
function getBookmarks(){try{return JSON.parse(localStorage.getItem("qbit-browser-bookmarks")||"[]").filter(x=>x&&typeof x.url==="string"&&typeof x.title==="string");}catch{return[];}}
function saveBookmarks(items){localStorage.setItem("qbit-browser-bookmarks",JSON.stringify(items));}
function renderBookmarks(){const nav=$("bookmarks");nav.querySelectorAll(".saved-bookmark").forEach(n=>n.remove());const items=getBookmarks();for(const item of items){const b=document.createElement("button");b.className="bookmark saved-bookmark";b.title=item.url;b.textContent=item.title.slice(0,22);b.onclick=()=>window.qbitBrowser.navigate(item.url);nav.insertBefore(b,$("manageBookmarks"));}}
function toggleBookmark(){if(!lastState||!lastState.url||lastState.url==="qbit://home")return;const items=getBookmarks(),index=items.findIndex(x=>x.url===lastState.url);if(index>=0)items.splice(index,1);else items.push({url:lastState.url,title:lastState.title||lastState.host||lastState.url});saveBookmarks(items);renderBookmarks();state(lastState);}
function openFind(){findBar.classList.add("open");findInput.focus();findInput.select();}
function runFind(forward=true,next=false){window.qbitBrowser.find(findInput.value,forward,next);$("findCount").textContent=findInput.value?"Buscando…":"";}
function closeFind(){findBar.classList.remove("open");window.qbitBrowser.clearFind();$("findCount").textContent="";a.focus();}
$("back").onclick=()=>window.qbitBrowser.back();$("forward").onclick=()=>window.qbitBrowser.forward();$("reload").onclick=()=>lastState?.loading?window.qbitBrowser.stop():window.qbitBrowser.reload();$("home").onclick=()=>window.qbitBrowser.navigate("qbit://home");$("go").onclick=go;$("newTab").onclick=()=>window.qbitBrowser.newTab();$("bookmark").onclick=toggleBookmark;$("find").onclick=openFind;
document.querySelectorAll(".bookmark[data-url]").forEach(b=>b.onclick=()=>window.qbitBrowser.navigate(b.dataset.url));
$("manageBookmarks").onclick=()=>{const items=getBookmarks();const action=prompt(items.length?"Tus favoritos:\n"+items.map((x,i)=>(i+1)+". "+x.title+" — "+x.url).join("\n")+"\n\nEscribí el número para quitarlo, o Cancelar:":"Todavía no guardaste favoritos.");if(action===null)return;const n=Number(action);if(Number.isInteger(n)&&n>0&&n<=items.length){items.splice(n-1,1);saveBookmarks(items);renderBookmarks();}};
a.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();go();}if(e.key==="Escape")a.blur();};
findInput.oninput=()=>{clearTimeout(findTimer);findTimer=setTimeout(()=>runFind(true,false),120);};findInput.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();runFind(!e.shiftKey,true);}if(e.key==="Escape")closeFind();};
$("findPrev").onclick=()=>runFind(false,true);$("findNext").onclick=()=>runFind(true,true);$("findClose").onclick=closeFind;
window.addEventListener("keydown",e=>{const mod=e.ctrlKey||e.metaKey;if(mod&&e.key.toLowerCase()==="l"){e.preventDefault();a.focus();a.select();return;}if(mod&&e.shiftKey&&e.key.toLowerCase()==="t"){e.preventDefault();window.qbitBrowser.reopenTab();return;}if(mod&&e.key.toLowerCase()==="t"){e.preventDefault();window.qbitBrowser.newTab();return;}if(mod&&/^[1-9]$/.test(e.key)){e.preventDefault();const list=lastState?.tabs||[],index=e.key==="9"?list.length-1:Number(e.key)-1;if(list[index])window.qbitBrowser.selectTab(list[index].id);return;}if(mod&&e.key.toLowerCase()==="w"){e.preventDefault();const active=lastState?.tabs?.find(t=>t.active);if(active)window.qbitBrowser.closeTab(active.id);return;}if(mod&&e.key.toLowerCase()==="r"){e.preventDefault();window.qbitBrowser.reload();return;}if(mod&&e.key.toLowerCase()==="f"){e.preventDefault();openFind();return;}if(e.altKey&&e.key==="ArrowLeft"){e.preventDefault();window.qbitBrowser.back();return;}if(e.altKey&&e.key==="ArrowRight"){e.preventDefault();window.qbitBrowser.forward();return;}if(mod&&e.key==="Tab"){e.preventDefault();const list=lastState?.tabs||[],i=list.findIndex(t=>t.active);if(list.length>1)window.qbitBrowser.selectTab(list[(i+(e.shiftKey?-1:1)+list.length)%list.length].id);}});
window.qbitBrowser.onState(state);renderBookmarks();a.focus();})();
</script></body></html>
