function isBookmarked(url){return getBookmarks().some(x=>x.url===url);}
function getBookmarks(){try{return JSON.parse(localStorage.getItem("qbit-browser-bookmarks")||"[]").filter(x=>x&&typeof x.url==="string"&&typeof x.title==="string");}catch{return[];}}
function saveBookmarks(items){localStorage.setItem("qbit-browser-bookmarks",JSON.stringify(items));}
function renderBookmarks(){const nav=$("bookmarks");nav.querySelectorAll(".saved-bookmark,.saved-folder").forEach(n=>n.remove());const items=getBookmarks();let folder="";for(const item of items){const current=item.folder||"General";if(current!==folder){folder=current;const sep=document.createElement("span");sep.className="bookmark-sep saved-folder";sep.title=folder;nav.insertBefore(sep,$("manageBookmarks"));}const b=document.createElement("button");b.className="bookmark saved-bookmark";b.title=folder+" · "+item.url;b.textContent=item.title.slice(0,22);b.onclick=()=>window.qbitBrowser.navigate(item.url);nav.insertBefore(b,$("manageBookmarks"));}}
function toggleBookmark(){if(!lastState||!lastState.url||lastState.url==="qbit://home")return;const items=getBookmarks(),index=items.findIndex(x=>x.url===lastState.url);if(index>=0)items.splice(index,1);else{const folder=(prompt("Carpeta del favorito (por ejemplo: Escuela, IA, Desarrollo):","General")||"General").trim().slice(0,32);items.push({url:lastState.url,title:lastState.title||lastState.host||lastState.url,folder:folder||"General"});}saveBookmarks(items);renderBookmarks();state(lastState);}
function openFind(){findBar.classList.add("open");findInput.focus();findInput.select();}
function runFind(forward=true,next=false){window.qbitBrowser.find(findInput.value,forward,next);$("findCount").textContent=findInput.value?"Buscando…":"";}
function closeFind(){findBar.classList.remove("open");window.qbitBrowser.clearFind();$("findCount").textContent="";a.focus();}
$("back").onclick=()=>window.qbitBrowser.back();$("forward").onclick=()=>window.qbitBrowser.forward();$("reload").onclick=()=>window.qbitBrowser.reload();$("stop").onclick=()=>window.qbitBrowser.stop();$("home").onclick=()=>window.qbitBrowser.navigate("qbit://home");$("go").onclick=go;$("newTab").onclick=()=>window.qbitBrowser.newTab();$("bookmark").onclick=toggleBookmark;$("find").onclick=openFind;
document.querySelectorAll(".bookmark[data-url]").forEach(b=>b.onclick=()=>window.qbitBrowser.navigate(b.dataset.url));
$("manageBookmarks").onclick=()=>{const items=getBookmarks();const action=prompt(items.length?"Tus favoritos:\n"+items.map((x,i)=>(i+1)+". ["+(x.folder||"General")+"] "+x.title+" — "+x.url).join("\n")+"\n\nEscribí el número para quitarlo, o Cancelar:":"Todavía no guardaste favoritos.");if(action===null)return;const n=Number(action);if(Number.isInteger(n)&&n>0&&n<=items.length){items.splice(n-1,1);saveBookmarks(items);renderBookmarks();}};
let suggestionTimer=null,suggestionItems=[],suggestionIndex=-1;const suggestionBox=document.createElement("div");suggestionBox.style.cssText="display:none;position:absolute;top:43px;left:0;right:0;max-height:280px;overflow:auto;background:#0b1b29;border:1px solid #345466;border-radius:12px;z-index:40;padding:5px";$("address-wrap").style.position="relative";$("address-wrap").append(suggestionBox);function closeSuggestions(){suggestionBox.style.display="none";suggestionBox.replaceChildren();suggestionItems=[];suggestionIndex=-1;}function showSuggestions(items){suggestionItems=items.slice(0,8);suggestionIndex=-1;suggestionBox.replaceChildren();for(const item of suggestionItems){const b=document.createElement("button");b.type="button";b.textContent=item;b.style.cssText="display:block;width:100%;padding:9px;text-align:left;border:0;border-radius:7px;background:transparent;color:#dceef5;cursor:pointer;font-size:12px";b.onclick=()=>{a.value=item;closeSuggestions();go();};suggestionBox.append(b);}suggestionBox.style.display=suggestionItems.length?"block":"none";}a.oninput=()=>{clearTimeout(suggestionTimer);const q=a.value.trim();if(q.length<2){closeSuggestions();return;}suggestionTimer=setTimeout(async()=>{try{const r=await fetch("https://suggestqueries.google.com/complete/search?client=firefox&q="+encodeURIComponent(q));const d=r.ok?await r.json():[];const local=getBookmarks().filter(x=>(x.title+" "+x.url).toLowerCase().includes(q.toLowerCase())).map(x=>x.url);showSuggestions([...new Set([...local,...(Array.isArray(d[1])?d[1]:[])])]);}catch{closeSuggestions();}},180);};a.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();if(suggestionIndex>=0&&suggestionItems[suggestionIndex])a.value=suggestionItems[suggestionIndex];closeSuggestions();go();}else if(e.key==="ArrowDown"&&suggestionItems.length){e.preventDefault();suggestionIndex=(suggestionIndex+1)%suggestionItems.length;[...suggestionBox.children].forEach((n,i)=>n.style.background=i===suggestionIndex?"#173747":"transparent");}else if(e.key==="Escape"){closeSuggestions();a.blur();}};
findInput.oninput=()=>{clearTimeout(findTimer);findTimer=setTimeout(()=>runFind(true,false),120);};findInput.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();runFind(!e.shiftKey,true);}if(e.key==="Escape")closeFind();};
$("findPrev").onclick=()=>runFind(false,true);$("findNext").onclick=()=>runFind(true,true);$("findClose").onclick=closeFind;
$("voice").onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){s.textContent="Búsqueda por voz no disponible";return;}const rec=new SR();rec.lang="es-AR";rec.interimResults=false;rec.onresult=e=>{a.value=e.results[0][0].transcript;go();};rec.onerror=e=>{s.textContent="No se pudo acceder al micrófono";};rec.start();s.textContent="Escuchando…";};$("downloads").onclick=openDownloads;$("more").onclick=showBrowserMenu;$("downloads-close").onclick=closeDownloads;$("downloads-clear").onclick=()=>window.qbitBrowser.downloadClear().then(openDownloads);window.qbitBrowser.onDownloads(()=>{if($("downloads-panel").style.display!=="none")openDownloads();});window.qbitBrowser.onShowDownloads(openDownloads);window.qbitBrowser.onFindResult(r=>{$("findCount").textContent=r.matches?`${r.activeMatchOrdinal}/${r.matches}`:"Sin coincidencias";});$("history").onclick=()=>{const enabled=localStorage.getItem("qbit-browser-history-enabled")==="true";if(!enabled){if(confirm("El historial está desactivado. ¿Querés activarlo?")){localStorage.setItem("qbit-browser-history-enabled","true");alert("Historial activado.");}return;}const items=JSON.parse(localStorage.getItem("qbit-browser-history")||"[]");const value=prompt("Historial reciente:\\n"+(items.length?items.slice(0,35).map((x,i)=>(i+1)+". "+x.title+" · "+new Date(x.visitedAt).toLocaleString("es-AR")).join("\\n"):"Todavía no hay páginas.")+"\\n\\nNúmero para abrir, OFF para desactivar o CLEAR para borrar.");if(value===null)return;if(value.toUpperCase()==="OFF"){localStorage.setItem("qbit-browser-history-enabled","false");alert("Historial desactivado.");}else if(value.toUpperCase()==="CLEAR"){localStorage.removeItem("qbit-browser-history");alert("Historial borrado.");}else{const n=Number(value);if(Number.isInteger(n)&&n>0&&n<=items.length)window.qbitBrowser.navigate(items[n-1].url);}};
$("classroom").onclick=async()=>{const b=$("classroom");b.disabled=true;s.textContent="Conectando Classroom…";try{await window.qbitBrowser.connectClassroom();alert("Google Classroom autorizado. Volvé a QBIT.");}catch(e){alert(e.message||"No se pudo conectar Google Classroom.");}finally{b.disabled=false;}};
window.addEventListener("keydown",e=>{const mod=e.ctrlKey||e.metaKey;if(e.key==="F11"){e.preventDefault();window.qbitBrowser.command("fullscreen");return;}if(mod&&e.shiftKey&&e.key.toLowerCase()==="i"){e.preventDefault();window.qbitBrowser.command("devtools");return;}if(mod&&e.shiftKey&&e.key.toLowerCase()==="a"){e.preventDefault();const list=lastState?.tabs||[];const q=prompt("Buscar pestaña abierta:\\n"+list.map((t,i)=>(i+1)+". "+t.title+" — "+t.url).join("\\n")+"\\n\\nEscribí parte del título o número:");if(q){const n=Number(q),target=Number.isInteger(n)&&n>0?list[n-1]:list.find(t=>(t.title+" "+t.url).toLowerCase().includes(q.toLowerCase()));if(target)window.qbitBrowser.selectTab(target.id);else alert("No encontré esa pestaña.");}return;}if(e.key==="F5"){e.preventDefault();if(e.shiftKey)window.qbitBrowser.command("hard-reload");else window.qbitBrowser.reload();return;}if(mod&&e.key.toLowerCase()==="d"){e.preventDefault();toggleBookmark();return;}if(mod&&e.key.toLowerCase()==="h"){e.preventDefault();$("history").click();return;}if(mod&&e.shiftKey&&e.key.toLowerCase()==="b"){e.preventDefault();const nav=$("bookmarks");nav.style.display=nav.style.display==="none"?"flex":"none";localStorage.setItem("qbit-bookmarks-bar-hidden",nav.style.display==="none"?"true":"false");return;}if(e.altKey&&e.key==="Home"){e.preventDefault();window.qbitBrowser.navigate("qbit://home");return;}if(mod&&e.shiftKey&&e.key==="Delete"){e.preventDefault();window.qbitBrowser.command("clear-site-data");return;}if(mod&&e.key.toLowerCase()==="j"){e.preventDefault();openDownloads();return;}if(mod&&e.key.toLowerCase()==="s"){e.preventDefault();window.qbitBrowser.command("save-page");return;}if(mod&&e.key.toLowerCase()==="p"){e.preventDefault();window.qbitBrowser.command("print");return;}if(mod&&e.shiftKey&&e.key.toLowerCase()==="n"){e.preventDefault();window.qbitBrowser.privateTab();return;}if(mod&&(e.key==="+"||e.key==="=")){e.preventDefault();window.qbitBrowser.command("zoom-in");return;}if(mod&&e.key==="-"){e.preventDefault();window.qbitBrowser.command("zoom-out");return;}if(mod&&e.key==="0"){e.preventDefault();window.qbitBrowser.command("zoom-reset");return;}if(mod&&e.key.toLowerCase()==="l"){e.preventDefault();a.focus();a.select();return;}if(mod&&e.shiftKey&&e.key.toLowerCase()==="t"){e.preventDefault();window.qbitBrowser.reopenTab();return;}if(mod&&e.key.toLowerCase()==="t"){e.preventDefault();window.qbitBrowser.newTab();return;}if(mod&&/^[1-9]$/.test(e.key)){e.preventDefault();const list=lastState?.tabs||[],index=e.key==="9"?list.length-1:Number(e.key)-1;if(list[index])window.qbitBrowser.selectTab(list[index].id);return;}if(mod&&e.key.toLowerCase()==="w"){e.preventDefault();const active=lastState?.tabs?.find(t=>t.active);if(active)window.qbitBrowser.closeTab(active.id);return;}if(mod&&e.key.toLowerCase()==="r"){e.preventDefault();window.qbitBrowser.reload();return;}if(mod&&e.key.toLowerCase()==="f"){e.preventDefault();openFind();return;}if(e.altKey&&e.key==="ArrowLeft"){e.preventDefault();window.qbitBrowser.back();return;}if(e.altKey&&e.key==="ArrowRight"){e.preventDefault();window.qbitBrowser.forward();return;}if(mod&&e.key==="Tab"){e.preventDefault();const list=lastState?.tabs||[],i=list.findIndex(t=>t.active);if(list.length>1)window.qbitBrowser.selectTab(list[(i+(e.shiftKey?-1:1)+list.length)%list.length].id);}});
window.qbitBrowser.onState(state);renderBookmarks();if(localStorage.getItem("qbit-bookmarks-bar-hidden")==="true")$("bookmarks").style.display="none";a.focus();})();
</script></body></html>
