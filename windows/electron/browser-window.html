<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QBIT Browser</title><style>:root{color-scheme:dark;font-family:Segoe UI,Arial,sans-serif;background:#07111f;color:#e8f4fa}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}#toolbar{height:66px;display:flex;align-items:center;gap:8px;padding:10px 13px;background:#0b1927;border-bottom:1px solid #203847}.brand{display:flex;align-items:center;gap:8px;margin-right:7px;color:#9cecf5;font-size:13px;font-weight:800;letter-spacing:.12em;white-space:nowrap}.mark{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:#123b49;color:#78e4ee;font-size:16px}button{width:36px;height:36px;flex:0 0 36px;border:1px solid #2b4352;border-radius:9px;background:#122333;color:#d8edf4;font-size:17px;cursor:pointer}button:hover{border-color:#5bd5e2;background:#173342}button:disabled{opacity:.35;cursor:default}#address{height:38px;min-width:80px;flex:1;padding:0 13px;border:1px solid #2b4352;border-radius:10px;outline:0;background:#07131f;color:#e8f4fa;font:13px Segoe UI,Arial,sans-serif}#address:focus{border-color:#50cddd}#status{max-width:180px;overflow:hidden;color:#8da8b7;font-size:11px;text-overflow:ellipsis;white-space:nowrap}#status.ready{color:#7ce0bc}@media(max-width:760px){.brand span:last-child,#status{display:none}#toolbar{gap:5px;padding:8px}}</style></head><body><header id="toolbar"><div class="brand"><div class="mark">Q</div><span>QBIT BROWSER</span></div><button id="back" title="Atrás">‹</button><button id="forward" title="Adelante">›</button><button id="reload" title="Recargar">↻</button><input id="address" type="text" spellcheck="false" autocomplete="off" aria-label="Dirección web" placeholder="Buscar o escribir una dirección…"><button id="go" title="Ir">➜</button><span id="status">Chromium integrado</span></header><script>(()=>{const $=id=>document.getElementById(id),a=$("address"),s=$("status");function state(x){if(!x)return;if(document.activeElement!==a)a.value=x.url||"";$("back").disabled=!x.canGoBack;$("forward").disabled=!x.canGoForward;$("reload").textContent=x.loading?"×":"↻";s.textContent=x.loading?"Cargando…":x.provider?x.provider+(x.aiReady?" · IA lista":" · Preparando IA…"):"Navegador Chromium";s.className=x.provider&&x.aiReady?"ready":"";document.title=(x.title||"QBIT Browser")+" — QBIT";}async function go(){try{await window.qbitBrowser.navigate(a.value.trim());}catch(e){s.textContent=e?.message||"No se pudo abrir";}}$("back").onclick=()=>window.qbitBrowser.back();$("forward").onclick=()=>window.qbitBrowser.forward();$("reload").onclick=()=>window.qbitBrowser.reload();$("go").onclick=go;a.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();go();}};window.qbitBrowser.onState(state);a.value="https://chatgpt.com/";a.focus();})();</script></body></html>
