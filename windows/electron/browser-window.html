<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QBIT Browser</title>
<style>
:root{color-scheme:dark;font-family:Segoe UI,Arial,sans-serif;background:#07111f;color:#e8f4fa}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
#chrome{height:104px;background:#0a1724;border-bottom:1px solid #203847;display:flex;flex-direction:column}
#tabs{height:39px;display:flex;align-items:end;gap:5px;padding:5px 9px 0;overflow:hidden;background:#07111c}
.tab{height:33px;min-width:100px;max-width:220px;flex:1;display:flex;align-items:center;gap:8px;padding:0 10px;border:1px solid #233c4c;border-bottom:0;border-radius:9px 9px 0 0;background:#0d1d2b;color:#9bb5c2;cursor:pointer;font-size:12px}
.tab.active{background:#142b3a;color:#e9fbff;border-color:#397084}.tab span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.tab button{border:0;background:transparent;color:#9bb5c2;cursor:pointer;padding:2px 5px;font-size:15px}.tab-add{width:30px;height:28px;border:0;border-radius:8px;background:#122b3a;color:#9cecf5;font-size:19px;cursor:pointer}
#toolbar{height:65px;display:flex;align-items:center;gap:8px;padding:9px 13px}
.brand{display:flex;align-items:center;gap:8px;margin-right:5px;color:#9cecf5;font-size:12px;font-weight:800;letter-spacing:.1em;white-space:nowrap}
.mark{display:grid;place-items:center;width:29px;height:29px;border-radius:9px;background:#123b49;color:#78e4ee;font-size:16px}
.tool{width:35px;height:35px;flex:0 0 35px;border:1px solid #2b4352;border-radius:9px;background:#122333;color:#d8edf4;font-size:17px;cursor:pointer}.tool:hover{border-color:#5bd5e2;background:#173342}.tool:disabled{opacity:.3;cursor:default}
#address-wrap{height:39px;min-width:80px;flex:1;display:flex;align-items:center;gap:8px;padding:0 11px;border:1px solid #2b4352;border-radius:11px;background:#07131f}
#secure{color:#75d7bb;font-size:13px}#address{width:100%;height:100%;border:0;outline:0;background:transparent;color:#e8f4fa;font:13px Segoe UI,Arial,sans-serif}
#address-wrap:focus-within{border-color:#50cddd}#status{max-width:130px;overflow:hidden;color:#8da8b7;font-size:11px;text-overflow:ellipsis;white-space:nowrap}
#status.ready{color:#7ce0bc}@media(max-width:760px){.brand span:last-child,#status{display:none}#toolbar{gap:5px;padding:7px}.tab{min-width:60px}}
</style></head><body>
<header id="chrome"><div id="tabs"><button class="tab-add" id="newTab" title="Nueva pestaña">+</button></div>
<div id="toolbar"><div class="brand"><div class="mark">Q</div><span>QBIT</span></div>
<button class="tool" id="back" title="Atrás">‹</button><button class="tool" id="forward" title="Adelante">›</button><button class="tool" id="reload" title="Recargar">↻</button><button class="tool" id="home" title="Inicio">⌂</button>
<div id="address-wrap"><span id="secure">◎</span><input id="address" type="text" spellcheck="false" autocomplete="off" aria-label="Dirección o búsqueda" placeholder="Buscar en Google o escribir una dirección"></div>
<button class="tool" id="go" title="Ir">➜</button><span id="status">Navegador listo</span></div></header>
<script>
(()=>{const $=id=>document.getElementById(id),a=$("address"),s=$("status"),tabs=$("tabs");
function renderTabs(items){tabs.querySelectorAll(".tab").forEach(n=>n.remove());for(const t of items||[]){const b=document.createElement("div");b.className="tab"+(t.active?" active":"");b.title=t.title;b.addEventListener("click",()=>window.qbitBrowser.selectTab(t.id));const label=document.createElement("span");label.textContent=t.title||"Nueva pestaña";const close=document.createElement("button");close.textContent="×";close.title="Cerrar pestaña";close.addEventListener("click",e=>{e.stopPropagation();window.qbitBrowser.closeTab(t.id)});b.append(label,close);tabs.insertBefore(b,$("newTab"));}}
function state(x){if(!x)return;if(document.activeElement!==a)a.value=x.url==="qbit://home"||String(x.url||"").startsWith("data:text/html")?"":x.url||"";$("back").disabled=!x.canGoBack;$("forward").disabled=!x.canGoForward;$("reload").textContent=x.loading?"×":"↻";s.textContent=x.loading?"Cargando…":x.provider?(x.provider+(x.aiReady?" · IA integrada":" · Preparando IA…")):"Listo";s.className=x.provider&&x.aiReady?"ready":"";document.title=(x.title||"Nueva pestaña")+" — QBIT Browser";renderTabs(x.tabs);}
async function go(){try{await window.qbitBrowser.navigate(a.value.trim());}catch(e){s.textContent=e?.message||"No se pudo abrir";}}
$("back").onclick=()=>window.qbitBrowser.back();$("forward").onclick=()=>window.qbitBrowser.forward();$("reload").onclick=()=>window.qbitBrowser.reload();$("home").onclick=()=>window.qbitBrowser.navigate("qbit://home");$("go").onclick=go;$("newTab").onclick=()=>window.qbitBrowser.newTab();a.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();go();}};
window.qbitBrowser.onState(state);window.qbitBrowser.newTab();a.focus();})();
</script></body></html>
