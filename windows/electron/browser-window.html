<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QBIT Browser</title>
<style>
:root{
 color-scheme:dark;
 font-family:"Segoe UI Variable","Segoe UI",Arial,sans-serif;
 background:#0b1118;
 color:#e8f5f8;
 --qbit-cyan:#55dce8;
 --qbit-cyan-soft:#9af2f4;
 --chrome:#111a23;
 --chrome-raised:#17232e;
 --chrome-hover:#223440;
 --chrome-line:#263b48;
 --muted:#91a9b5;
 --text:#e8f5f8;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#0b1118;color:var(--text);font-family:"Segoe UI Variable","Segoe UI",Arial,sans-serif}
button,input{font:inherit}
button{user-select:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--qbit-cyan);outline-offset:2px}
#chrome{
 height:138px;min-width:0;display:flex;flex-direction:column;position:relative;z-index:10;
 background:linear-gradient(180deg,#17232d 0%,#111a23 100%);
 border-bottom:1px solid #263b48;
 box-shadow:0 5px 18px #0002;
}
#load-progress{position:absolute;left:0;right:0;top:0;height:2px;overflow:hidden;z-index:12;pointer-events:none}
#load-progress:after{content:"";display:block;width:34%;height:100%;background:linear-gradient(90deg,transparent,var(--qbit-cyan),#b4fbff,transparent);transform:translateX(-110%);opacity:0}
#load-progress.loading:after{opacity:1;animation:progress 1.15s ease-in-out infinite}
@keyframes progress{to{transform:translateX(390%)}}
#tabs{
 height:37px;flex:0 0 37px;display:flex;align-items:end;gap:4px;
 padding:6px 9px 0;overflow-x:auto;overflow-y:hidden;
 background:#0e171f;scrollbar-width:thin;scrollbar-color:#36515f transparent;
}
.tab{
 height:30px;min-width:82px;max-width:245px;flex:1 1 170px;
 display:flex;align-items:center;gap:8px;padding:0 10px;
 border:1px solid transparent;border-bottom:0;border-radius:10px 10px 0 0;
 background:#17232d;color:#a8bdc7;cursor:pointer;font-size:12px;
 position:relative;transition:background .16s,color .16s,border-color .16s;
}
.tab:hover{background:#20313d;color:#e6f5f8}
.tab.active{
 background:linear-gradient(180deg,#243744,#1c303b);
 color:#f0fcff;border-color:#355767;
 box-shadow:inset 0 1px 0 #8ceaf01c;
}
.tab.active:before{content:"";position:absolute;left:14px;right:14px;top:0;height:2px;border-radius:0 0 3px 3px;background:var(--qbit-cyan);opacity:.9}
.tab span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.tab button{
 width:22px;height:22px;flex:0 0 22px;display:grid;place-items:center;
 border:0;border-radius:6px;background:transparent;color:#92a9b4;
 cursor:pointer;padding:0;font-size:16px;line-height:1;
}
.tab button:hover{background:#3b505c;color:#fff}
.tab.pinned{flex:0 0 43px;min-width:43px;max-width:43px;padding:0 13px;justify-content:center}
.tab.pinned span{display:block;flex:0 0 12px;width:12px;font-weight:700}
.tab.pinned button{display:none}
.tab.grouped{border-top:2px solid var(--group-color,var(--qbit-cyan))}
.tab .favicon{width:15px;height:15px;flex:0 0 15px;object-fit:contain;border-radius:3px}
.tab .loading{width:13px;height:13px;flex:0 0 13px;border:2px solid #45606c;border-top-color:var(--qbit-cyan);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tab-add{
 width:29px;height:27px;flex:0 0 29px;display:grid;place-items:center;
 margin:0 2px 2px;border:0;border-radius:50%;background:transparent;
 color:#b4cbd4;font-size:20px;line-height:1;cursor:pointer;transition:.16s;
}
.tab-add:hover{background:#263c48;color:var(--qbit-cyan-soft)}
#toolbar{
 height:62px;flex:0 0 62px;min-width:0;
 display:grid;grid-template-columns:auto auto minmax(100px,1fr) auto;
 align-items:center;gap:11px;padding:8px 15px;
 background:linear-gradient(180deg,#17232d,#131e27);
}
.brand{display:flex;align-items:center;gap:8px;margin:0 3px 0 0;color:#d9edf1;font-size:11px;font-weight:800;letter-spacing:.12em;white-space:nowrap}
.mark{
 width:29px;height:29px;display:grid;place-items:center;border-radius:10px;
 background:linear-gradient(145deg,#155365,#123b49);color:#a1f5f5;
 font-size:16px;box-shadow:0 3px 13px #24b8c52b,inset 0 1px 0 #ffffff20;
}
.nav-controls,.toolbar-actions{display:flex;align-items:center;gap:3px;min-width:0}
.tool{
 width:35px;height:35px;flex:0 0 35px;display:grid;place-items:center;
 border:1px solid transparent;border-radius:11px;background:transparent;
 color:#b5c7ce;font-size:19px;line-height:1;cursor:pointer;
 transition:background .16s,color .16s,border-color .16s,transform .16s;
}
.tool:hover{background:#263a46;border-color:#314d5b;color:#f0fcff}
.tool:active{transform:scale(.94)}
.tool:disabled{opacity:.32;cursor:default;transform:none}
.tool.active{background:#173d49;border-color:#28606b;color:var(--qbit-cyan-soft)}
#address-wrap{
 height:42px;width:100%;min-width:0;display:flex;align-items:center;gap:10px;
 padding:0 13px;border:1px solid #304652;border-radius:14px;
 background:#0d171f;box-shadow:inset 0 1px 3px #0004;
 transition:border-color .16s,box-shadow .16s,background .16s;
}
#address-wrap:hover{background:#111e28;border-color:#3d5c69}
#address-wrap:focus-within{background:#101e28;border-color:var(--qbit-cyan);box-shadow:0 0 0 3px #55dce81c,inset 0 1px 3px #0003}
#secure{flex:0 0 auto;color:#8bd9d5;font-size:14px}
#address{width:100%;height:100%;min-width:0;border:0;outline:0;background:transparent;color:#edf9fb;font:13px "Segoe UI Variable","Segoe UI",Arial,sans-serif}
#address::placeholder{color:#8299a4;opacity:1}
.address-action{
 width:29px;height:29px;flex:0 0 29px;display:grid;place-items:center;
 border:0;border-radius:50%;background:transparent;color:#a9bdc5;cursor:pointer;font-size:15px;
}
.address-action:hover{background:#293d49;color:var(--qbit-cyan-soft)}
#status{max-width:190px;overflow:hidden;color:var(--muted);font-size:11px;text-overflow:ellipsis;white-space:nowrap}
#status.ready{color:#83dfc3}
#bookmarks{
 height:39px;flex:0 0 39px;display:flex;align-items:center;gap:5px;
 padding:0 17px;background:#111a23;border-top:1px solid #263945;overflow:hidden;
}
.bookmark{
 height:28px;max-width:190px;display:flex;align-items:center;gap:8px;
 padding:0 10px;border:1px solid transparent;border-radius:8px;
 background:transparent;color:#b4c7cf;font-size:12px;white-space:nowrap;
 cursor:pointer;transition:background .15s,color .15s,border-color .15s;
}
.bookmark:hover{background:#223642;border-color:#304d5b;color:#f0fcff}
.bookmark .dot{width:7px;height:7px;flex:0 0 7px;border-radius:50%;background:var(--qbit-cyan);box-shadow:0 0 8px #55dce866}
.bookmark-sep{height:17px;width:1px;flex:0 0 1px;background:#344b57;margin:0 3px}
#browser-menu{
 top:4px!important;right:14px!important;width:270px!important;max-height:412px;
 overflow-y:auto;background:#172630!important;border:1px solid #3a5663!important;
 border-radius:14px!important;padding:7px!important;box-shadow:0 16px 48px #0009!important;
}
#browser-menu button{display:block;width:100%;padding:10px 12px;text-align:left;border:0;border-radius:8px;background:transparent;color:#e2f1f5;font:13px "Segoe UI",Arial;cursor:pointer}
#browser-menu button:hover{background:#29414d}
#downloads-panel{
 top:4px!important;max-height:412px!important;background:#172630!important;
 border:1px solid #3a5663!important;border-radius:14px!important;box-shadow:0 16px 48px #0009!important;
}
#downloads-list{display:grid;gap:8px}
.download-row{display:grid;gap:5px;padding:10px;border:1px solid #304b58;border-radius:10px;background:#101d26;font-size:12px}
.download-row span{color:#9bb1bb}
.download-row div{display:flex;gap:6px}
.download-row button{padding:6px 10px;border:1px solid #365766;border-radius:8px;background:#193744;color:#e1fbff;cursor:pointer}
#findbar{
 position:absolute;right:16px;top:91px;display:none;align-items:center;gap:6px;
 padding:8px;background:#172630;border:1px solid #3a5663;border-radius:13px;
 box-shadow:0 14px 40px #0009;z-index:30;
}
#findbar.open{display:flex}
#findInput{width:220px;background:#0e1921;color:#edf9fb;border:1px solid #36515f;border-radius:8px;padding:8px;outline:none}
#findInput:focus{border-color:var(--qbit-cyan)}
.find-btn{width:29px;height:29px;border:0;border-radius:8px;background:#203c49;color:#e0faff;cursor:pointer}
.find-btn:hover{background:#2b5360}
.find-count{font-size:10px;color:#9bb2bd;min-width:35px}
#tab-context-menu{
 position:fixed;z-index:100;display:none;min-width:220px;padding:6px;
 background:#172630;border:1px solid #3a5663;border-radius:12px;
 box-shadow:0 12px 36px #0009;
}
#tab-context-menu.open{display:block}
#tab-context-menu button{display:block;width:100%;padding:9px 12px;text-align:left;border:0;border-radius:7px;background:transparent;color:#e2f1f5;font:13px "Segoe UI",Arial;cursor:pointer}
#tab-context-menu button:hover{background:#29414d}
#tab-context-menu .menu-separator{height:1px;margin:5px 4px;background:#344b57}
@media(max-width:1000px){
 .brand span:last-child,#status{display:none}
 #toolbar{gap:6px;padding:8px 10px}
 .nav-controls,.toolbar-actions{gap:0}
 .tool{width:32px;flex-basis:32px}
 #bookmarks{gap:2px;padding:0 8px}
 .bookmark{padding:0 8px}
}
@media(max-width:820px){
 #toolbar{grid-template-columns:auto auto minmax(80px,1fr) auto;gap:4px;padding:6px 8px}
 .nav-controls #home,.toolbar-actions #history{display:none}
 .brand{margin-right:0}
 .tool{width:30px;flex-basis:30px}
 #address-wrap{height:40px;padding:0 9px}
}
@media(max-width:680px){
 #toolbar{grid-template-columns:minmax(70px,1fr) auto;gap:5px;padding:6px 8px}
 .brand,.nav-controls #back,.nav-controls #forward,.toolbar-actions #bookmark{display:none}
 .nav-controls{grid-column:2;grid-row:1}
 #address-wrap{grid-column:1;grid-row:1}
 .toolbar-actions{display:none}
 #bookmarks{padding:0 8px;gap:2px}
 .bookmark{padding:0 7px}
 .tab{min-width:70px;flex-basis:100px}
 #findInput{width:145px}
}
@media(prefers-reduced-motion:reduce){
 *,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}
}
</style></head><body>
<header id="chrome"><div id="load-progress"></div><div id="tabs"><button class="tab-add" id="newTab" title="Nueva pestaña (Ctrl+T)">+</button></div>
<div id="toolbar">
<div class="brand"><div class="mark">Q</div><span>QBIT</span></div>
<div class="nav-controls">
<button class="tool" id="back" title="Atrás (Alt+←)">‹</button><button class="tool" id="forward" title="Adelante (Alt+→)">›</button><button class="tool" id="reload" title="Recargar (Ctrl+R)">↻</button><button class="tool" id="stop" title="Detener carga" style="display:none">×</button><button class="tool" id="home" title="Inicio">⌂</button>
</div>
<div id="address-wrap"><span id="secure">◉</span><input id="address" type="text" spellcheck="false" autocomplete="off" aria-label="Dirección o búsqueda" placeholder="Buscar en Google o escribir una dirección (Ctrl+L)"><button class="address-action" id="voice" title="Buscar por voz" aria-label="Buscar por voz">🎙</button></div>
<div class="toolbar-actions">
<button class="tool" id="bookmark" title="Guardar esta página">☆</button><button class="tool" id="history" title="Historial">◷</button><button class="tool" id="downloads" title="Descargas (Ctrl+J)">↓</button><button class="tool" id="extensions" title="Administrar extensiones">🧩</button><button class="tool" id="more" title="Personalizar y controlar QBIT Browser">⋮</button>
</div>
<button class="tool" id="classroom" title="Conectar Google Classroom" hidden>▣</button><button class="tool" id="find" title="Buscar en esta página (Ctrl+F)" hidden>⌕</button><button class="tool" id="go" title="Ir" hidden>➜</button><span id="status" hidden>Navegador listo</span></div>
<nav id="bookmarks"><button class="bookmark" data-url="https://www.google.com/"><span class="dot"></span>Google</button><button class="bookmark" data-url="https://www.youtube.com/"><span class="dot"></span>YouTube</button><button class="bookmark" data-url="https://chatgpt.com/"><span class="dot"></span>ChatGPT</button><button class="bookmark" data-url="https://github.com/"><span class="dot"></span>GitHub</button><span class="bookmark-sep"></span><button class="bookmark" id="manageBookmarks" title="Administrar favoritos">＋ Favoritos</button></nav></header>
<div id="downloads-panel" style="display:none;position:absolute;right:16px;top:100px;width:min(420px,90vw);max-height:65vh;overflow:auto;padding:14px;background:#0b1b29;border:1px solid #36586a;border-radius:12px;box-shadow:0 12px 38px #000b;z-index:35"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><strong>Descargas</strong><button class="find-btn" id="downloads-clear">Limpiar</button><button class="find-btn" id="downloads-close">×</button></div><div id="downloads-list"></div></div><div id="tab-context-menu" role="menu"></div><div id="browser-menu" style="display:none;position:absolute;right:14px;top:94px;width:230px;padding:6px;background:#0b1b29;border:1px solid #36586a;border-radius:12px;box-shadow:0 12px 38px #000b;z-index:36"></div>
<div id="findbar"><input id="findInput" placeholder="Buscar en la página" autocomplete="off"><span class="find-count" id="findCount"></span><button class="find-btn" id="findPrev" title="Anterior">↑</button><button class="find-btn" id="findNext" title="Siguiente">↓</button><button class="find-btn" id="findClose" title="Cerrar">×</button></div>
<script>
(()=>{const $=id=>document.getElementById(id),a=$("address"),s=$("status"),tabs=$("tabs"),findBar=$("findbar"),findInput=$("findInput"),chrome=$("chrome");let lastState=null,findTimer=null;
function setChromeHeight(){chrome.style.height="138px";window.qbitBrowser.setChromeHeight(138).catch(()=>{});}
const tabMenu=$("tab-context-menu");let contextTab=null;
function hideTabMenu(){tabMenu.classList.remove("open");contextTab=null;}
function showTabMenu(event,t){event.preventDefault();contextTab=t;tabMenu.replaceChildren();const pins=JSON.parse(localStorage.getItem("qbit-pinned-tabs")||"[]");const actions=[
[pins.includes(t.url)?"Desfijar pestaña":"Fijar pestaña",()=>{const i=pins.indexOf(t.url);if(i>=0)pins.splice(i,1);else pins.push(t.url);localStorage.setItem("qbit-pinned-tabs",JSON.stringify(pins));renderTabs(lastState?.tabs||[]);}],
[t.muted?"Activar sonido":"Silenciar pestaña",()=>window.qbitBrowser.tabAction(t.id,"mute")],
["Recargar pestaña",()=>window.qbitBrowser.tabAction(t.id,"reload")],
["Cerrar las demás pestañas",()=>window.qbitBrowser.tabAction(t.id,"close-others")],
["Herramientas de desarrollador",()=>window.qbitBrowser.tabAction(t.id,"devtools")],
["Cerrar pestaña",()=>window.qbitBrowser.closeTab(t.id)]
];for(let i=0;i<actions.length;i++){if(i===1||i===5){const sep=document.createElement("div");sep.className="menu-separator";tabMenu.append(sep);}const button=document.createElement("button");button.type="button";button.textContent=actions[i][0];button.onclick=()=>{hideTabMenu();actions[i][1]();};tabMenu.append(button);}tabMenu.classList.add("open");const menuHeight=tabMenu.getBoundingClientRect().height;tabMenu.style.left=Math.max(8,Math.min(event.clientX,innerWidth-235))+"px";tabMenu.style.top=Math.max(8,Math.min(event.clientY,innerHeight-menuHeight-8))+"px";}
function renderTabs(items){tabs.querySelectorAll(".tab").forEach(n=>n.remove());for(const t of items||[]){const b=document.createElement("div"),pins=JSON.parse(localStorage.getItem("qbit-pinned-tabs")||"[]"),pinned=pins.includes(t.url);b.className="tab"+(t.active?" active":"")+(pinned?" pinned":"");b.title=(t.privateMode?"Ventana privada · ":"")+(t.title||"Nueva pestaña");b.addEventListener("click",()=>window.qbitBrowser.selectTab(t.id));b.addEventListener("auxclick",e=>{if(e.button===1){e.preventDefault();window.qbitBrowser.closeTab(t.id);}});b.addEventListener("contextmenu",e=>showTabMenu(e,t));if(t.privateMode){const icon=document.createElement("span");icon.textContent="◉";icon.title="Privada";icon.style.cssText="color:#b5a0ff;font-size:12px";b.append(icon);}else if(t.loading){const spin=document.createElement("i");spin.className="loading";b.append(spin);}else if(t.favicon&&!pinned){const img=document.createElement("img");img.className="favicon";img.src=t.favicon;img.onerror=()=>img.remove();b.append(img);}const label=document.createElement("span");label.textContent=pinned?(t.title||"Q").slice(0,1):(t.title||"Nueva pestaña");const close=document.createElement("button");close.textContent="×";close.title="Cerrar pestaña";close.addEventListener("click",e=>{e.stopPropagation();window.qbitBrowser.closeTab(t.id)});b.append(label,close);tabs.insertBefore(b,$("newTab"));}}
document.addEventListener("pointerdown",e=>{if(!tabMenu.contains(e.target))hideTabMenu();});window.addEventListener("blur",hideTabMenu);
document.addEventListener("pointerdown",e=>{const panel=$("browser-menu");if(panel.style.display==="block"&&!panel.contains(e.target)&&e.target!==$("more")){panel.style.display="none";setChromeHeight(138);}});
function state(x){if(!x)return;const previousUrl=lastState?.url;lastState=x;if(!x.privateMode&&x.url&&x.url!==previousUrl&&/^https?:/i.test(x.url)&&localStorage.getItem("qbit-browser-history-enabled")==="true"){try{const items=JSON.parse(localStorage.getItem("qbit-browser-history")||"[]").filter(v=>v.url!==x.url);items.unshift({url:x.url,title:x.title||x.host||x.url,visitedAt:Date.now()});localStorage.setItem("qbit-browser-history",JSON.stringify(items.slice(0,150)));}catch{}}if(document.activeElement!==a)a.value=x.url==="qbit://home"||String(x.url||"").startsWith("data:text/html")?"":x.url||"";$("back").disabled=!x.canGoBack;$("forward").disabled=!x.canGoForward;$("reload").textContent="↻";$("reload").title="Recargar";$("stop").style.display=x.loading?"block":"none";$("load-progress").classList.toggle("loading",!!x.loading);$("secure").textContent=x.url==="qbit://home"?"Q":x.secure?"🔒":"ⓘ";$("secure").style.color=x.secure?"#75d7bb":"#d9b77b";s.textContent=x.loading?"Cargando…":x.provider?(x.provider+(x.aiReady?" · IA integrada":" · Preparando IA…")):(x.host||"Nueva pestaña");s.className=x.provider&&x.aiReady?"ready":"";$("bookmark").classList.toggle("active",isBookmarked(x.url));$("bookmark").textContent=isBookmarked(x.url)?"★":"☆";document.title=(x.title||"Nueva pestaña")+" — QBIT Browser";renderTabs(x.tabs);}
function go(){let value=a.value.trim();if(!value)return;const at=value.match(/^@(bookmarks|history|tabs)(?:\s+(.*))?$/i);if(at){const kind=at[1].toLowerCase(),q=(at[2]||"").toLowerCase();if(kind==="tabs"){const list=lastState?.tabs||[],found=list.find(t=>(t.title+" "+t.url).toLowerCase().includes(q));if(found)window.qbitBrowser.selectTab(found.id);else alert(list.map((t,i)=>(i+1)+". "+t.title+" — "+t.url).join("\\n")||"No hay pestañas.");}else{const list=kind==="bookmarks"?getBookmarks():JSON.parse(localStorage.getItem("qbit-browser-history")||"[]");const matches=list.filter(x=>(x.title+" "+x.url).toLowerCase().includes(q));if(matches.length===1)window.qbitBrowser.navigate(matches[0].url);else alert(matches.slice(0,30).map((x,i)=>(i+1)+". "+x.title+" — "+x.url).join("\\n")||"No hay resultados.");}closeSuggestions();return;}const engines=getSearchEngines(),engine=engines.find(x=>value.toLowerCase().startsWith(x.keyword.toLowerCase()+" "));if(engine){value=engine.url.replace("%s",encodeURIComponent(value.slice(engine.keyword.length).trim()));}window.qbitBrowser.navigate(value).catch(e=>{s.textContent=e?.message||"No se pudo abrir";});}function getSearchEngines(){try{return JSON.parse(localStorage.getItem("qbit-search-engines")||"[]").filter(x=>x&&x.keyword&&x.url&&x.url.includes("%s"));}catch{return[];}}function openDownloads(){window.qbitBrowser.openPanel("downloads").catch(e=>{s.textContent=e.message||"No se pudieron abrir las descargas.";});}
function closeDownloads(){}
function showBrowserMenu(){closeSuggestions();window.qbitBrowser.openPanel("menu").catch(e=>{s.textContent=e.message||"No se pudo abrir el menú.";});}
function isBookmarked(url){return getBookmarks().some(x=>x.url===url);}
function getBookmarks(){try{return JSON.parse(localStorage.getItem("qbit-browser-bookmarks")||"[]").filter(x=>x&&typeof x.url==="string"&&typeof x.title==="string");}catch{return[];}}
function saveBookmarks(items){localStorage.setItem("qbit-browser-bookmarks",JSON.stringify(items));}
function renderBookmarks(){const nav=$("bookmarks");nav.querySelectorAll(".saved-bookmark,.saved-folder").forEach(n=>n.remove());const items=getBookmarks();let folder="";for(const item of items){const current=item.folder||"General";if(current!==folder){folder=current;const sep=document.createElement("span");sep.className="bookmark-sep saved-folder";sep.title=folder;nav.insertBefore(sep,$("manageBookmarks"));}const b=document.createElement("button");b.className="bookmark saved-bookmark";b.title=folder+" · "+item.url;b.textContent=item.title.slice(0,22);b.onclick=()=>window.qbitBrowser.navigate(item.url);nav.insertBefore(b,$("manageBookmarks"));}}
function toggleBookmark(){if(!lastState||!lastState.url||lastState.url==="qbit://home")return;const items=getBookmarks(),index=items.findIndex(x=>x.url===lastState.url);if(index>=0)items.splice(index,1);else{const folder=(prompt("Carpeta del favorito (por ejemplo: Escuela, IA, Desarrollo):","General")||"General").trim().slice(0,32);items.push({url:lastState.url,title:lastState.title||lastState.host||lastState.url,folder:folder||"General"});}saveBookmarks(items);renderBookmarks();state(lastState);}
function openFind(){findBar.classList.add("open");findInput.focus();findInput.select();}
function runFind(forward=true,next=false){window.qbitBrowser.find(findInput.value,forward,next);$("findCount").textContent=findInput.value?"Buscando…":"";}
function closeFind(){findBar.classList.remove("open");window.qbitBrowser.clearFind();$("findCount").textContent="";a.focus();}

$("manageBookmarks").onclick=()=>{const items=getBookmarks();const action=prompt(items.length?"Tus favoritos:\n"+items.map((x,i)=>(i+1)+". ["+(x.folder||"General")+"] "+x.title+" — "+x.url).join("\n")+"\n\nEscribí el número para quitarlo, o Cancelar:":"Todavía no guardaste favoritos.");if(action===null)return;const n=Number(action);if(Number.isInteger(n)&&n>0&&n<=items.length){items.splice(n-1,1);saveBookmarks(items);renderBookmarks();}};
let suggestionTimer=null,suggestionItems=[],suggestionIndex=-1;const suggestionBox=document.createElement("div");suggestionBox.style.cssText="display:none;position:absolute;top:43px;left:0;right:0;max-height:280px;overflow:auto;background:#0b1b29;border:1px solid #345466;border-radius:12px;z-index:40;padding:5px";$("address-wrap").style.position="relative";$("address-wrap").append(suggestionBox);function closeSuggestions(){suggestionBox.style.display="none";suggestionBox.replaceChildren();suggestionItems=[];suggestionIndex=-1;setChromeHeight(138);}function showSuggestions(items){suggestionItems=items.slice(0,8);suggestionIndex=-1;suggestionBox.replaceChildren();for(const item of suggestionItems){const b=document.createElement("button");b.type="button";b.textContent=item;b.style.cssText="display:block;width:100%;padding:9px;text-align:left;border:0;border-radius:7px;background:transparent;color:#dceef5;cursor:pointer;font-size:12px";b.onclick=()=>{a.value=item;closeSuggestions();go();};suggestionBox.append(b);}suggestionBox.style.display=suggestionItems.length?"block":"none";if(suggestionItems.length)setChromeHeight(suggestionBox.getBoundingClientRect().bottom+8);else setChromeHeight(138);}a.oninput=()=>{clearTimeout(suggestionTimer);const q=a.value.trim();if(q.length<2){closeSuggestions();return;}suggestionTimer=setTimeout(async()=>{try{const r=await fetch("https://suggestqueries.google.com/complete/search?client=firefox&q="+encodeURIComponent(q));const d=r.ok?await r.json():[];const local=getBookmarks().filter(x=>(x.title+" "+x.url).toLowerCase().includes(q.toLowerCase())).map(x=>x.url);showSuggestions([...new Set([...local,...(Array.isArray(d[1])?d[1]:[])])]);}catch{closeSuggestions();}},180);};a.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();if(suggestionIndex>=0&&suggestionItems[suggestionIndex])a.value=suggestionItems[suggestionIndex];closeSuggestions();go();}else if(e.key==="ArrowDown"&&suggestionItems.length){e.preventDefault();suggestionIndex=(suggestionIndex+1)%suggestionItems.length;[...suggestionBox.children].forEach((n,i)=>n.style.background=i===suggestionIndex?"#173747":"transparent");}else if(e.key==="Escape"){closeSuggestions();a.blur();}};
findInput.oninput=()=>{clearTimeout(findTimer);findTimer=setTimeout(()=>runFind(true,false),120);};findInput.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();runFind(!e.shiftKey,true);}if(e.key==="Escape")closeFind();};

$("voice").onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){s.textContent="Búsqueda por voz no disponible";return;}const rec=new SR();rec.lang="es-AR";rec.interimResults=false;rec.onresult=e=>{a.value=e.results[0][0].transcript;go();};rec.onerror=e=>{s.textContent="No se pudo acceder al micrófono";};rec.start();s.textContent="Escuchando…";};$("downloads").onclick=openDownloads;$("extensions").onclick=()=>window.qbitBrowser.manageExtensions().catch(e=>{s.textContent=e.message||"No se pudieron administrar las extensiones.";});$("more").onclick=showBrowserMenu;$("downloads-close").onclick=closeDownloads;$("downloads-clear").onclick=()=>window.qbitBrowser.downloadClear().then(openDownloads);window.qbitBrowser.onDownloads(()=>{if($("downloads-panel").style.display!=="none")openDownloads();});window.qbitBrowser.onShowDownloads(openDownloads);window.qbitBrowser.onFindResult(r=>{$("findCount").textContent=r.matches?`${r.activeMatchOrdinal}/${r.matches}`:"Sin coincidencias";});$("history").onclick=()=>{const items=JSON.parse(localStorage.getItem("qbit-browser-history")||"[]");window.qbitBrowser.openPanel("history",{items,enabled:localStorage.getItem("qbit-browser-history-enabled")==="true"}).catch(e=>{s.textContent=e.message||"No se pudo abrir el historial.";});};
window.qbitBrowser.onPanelCommand(action=>{
 if(action==="clear-history"){localStorage.removeItem("qbit-browser-history");s.textContent="Historial borrado.";}
 else if(action==="history-toggle"){const enabled=localStorage.getItem("qbit-browser-history-enabled")==="true";localStorage.setItem("qbit-browser-history-enabled",enabled?"false":"true");s.textContent=enabled?"Historial desactivado.":"Historial activado.";}
 else if(action==="history")$("history").click();
 else if(action==="bookmarks")window.qbitBrowser.openPanel("bookmarks",{items:getBookmarks()});
 else if(action==="bookmarks-manage")$("manageBookmarks").click();
 else if(action==="downloads")openDownloads();
 else if(action==="translate"&&lastState?.url)window.qbitBrowser.navigate("https://translate.google.com/translate?sl=auto&tl=es&u="+encodeURIComponent(lastState.url));
 else window.qbitBrowser.command(action).catch(e=>{s.textContent=e.message||"No se pudo ejecutar la acción.";});
});
$("classroom").onclick=async()=>{const b=$("classroom");b.disabled=true;s.textContent="Conectando Classroom…";try{await window.qbitBrowser.connectClassroom();alert("Google Classroom autorizado. Volvé a QBIT.");}catch(e){alert(e.message||"No se pudo conectar Google Classroom.");}finally{b.disabled=false;}};
window.addEventListener("keydown",e=>{const mod=e.ctrlKey||e.metaKey;if(e.key==="F11"){e.preventDefault();window.qbitBrowser.command("fullscreen");return;}if(mod&&e.shiftKey&&e.key.toLowerCase()==="i"){e.preventDefault();window.qbitBrowser.command("devtools");return;}if(mod&&e.shiftKey&&e.key.toLowerCase()==="a"){e.preventDefault();const list=lastState?.tabs||[];const q=prompt("Buscar pestaña abierta:\\n"+list.map((t,i)=>(i+1)+". "+t.title+" — "+t.url).join("\\n")+"\\n\\nEscribí parte del título o número:");if(q){const n=Number(q),target=Number.isInteger(n)&&n>0?list[n-1]:list.find(t=>(t.title+" "+t.url).toLowerCase().includes(q.toLowerCase()));if(target)window.qbitBrowser.selectTab(target.id);else alert("No encontré esa pestaña.");}return;}if(e.key==="F5"){e.preventDefault();if(e.shiftKey)window.qbitBrowser.command("hard-reload");else window.qbitBrowser.reload();return;}if(mod&&e.key.toLowerCase()==="d"){e.preventDefault();toggleBookmark();return;}if(mod&&e.key.toLowerCase()==="h"){e.preventDefault();$("history").click();return;}if(mod&&e.shiftKey&&e.key.toLowerCase()==="b"){e.preventDefault();const nav=$("bookmarks");nav.style.display=nav.style.display==="none"?"flex":"none";localStorage.setItem("qbit-bookmarks-bar-hidden",nav.style.display==="none"?"true":"false");return;}if(e.altKey&&e.key==="Home"){e.preventDefault();window.qbitBrowser.navigate("qbit://home");return;}if(mod&&e.shiftKey&&e.key==="Delete"){e.preventDefault();window.qbitBrowser.command("clear-site-data");return;}if(mod&&e.key.toLowerCase()==="j"){e.preventDefault();openDownloads();return;}if(mod&&e.key.toLowerCase()==="s"){e.preventDefault();window.qbitBrowser.command("save-page");return;}if(mod&&e.key.toLowerCase()==="p"){e.preventDefault();window.qbitBrowser.command("print");return;}if(mod&&e.shiftKey&&e.key.toLowerCase()==="n"){e.preventDefault();window.qbitBrowser.privateTab();return;}if(mod&&(e.key==="+"||e.key==="=")){e.preventDefault();window.qbitBrowser.command("zoom-in");return;}if(mod&&e.key==="-"){e.preventDefault();window.qbitBrowser.command("zoom-out");return;}if(mod&&e.key==="0"){e.preventDefault();window.qbitBrowser.command("zoom-reset");return;}if(mod&&e.key.toLowerCase()==="l"){e.preventDefault();a.focus();a.select();return;}if(mod&&e.shiftKey&&e.key.toLowerCase()==="t"){e.preventDefault();window.qbitBrowser.reopenTab();return;}if(mod&&e.key.toLowerCase()==="t"){e.preventDefault();window.qbitBrowser.newTab();return;}if(mod&&/^[1-9]$/.test(e.key)){e.preventDefault();const list=lastState?.tabs||[],index=e.key==="9"?list.length-1:Number(e.key)-1;if(list[index])window.qbitBrowser.selectTab(list[index].id);return;}if(mod&&e.key.toLowerCase()==="w"){e.preventDefault();const active=lastState?.tabs?.find(t=>t.active);if(active)window.qbitBrowser.closeTab(active.id);return;}if(mod&&e.key.toLowerCase()==="r"){e.preventDefault();window.qbitBrowser.reload();return;}if(mod&&e.key.toLowerCase()==="f"){e.preventDefault();openFind();return;}if(e.altKey&&e.key==="ArrowLeft"){e.preventDefault();window.qbitBrowser.back();return;}if(e.altKey&&e.key==="ArrowRight"){e.preventDefault();window.qbitBrowser.forward();return;}if(mod&&e.key==="Tab"){e.preventDefault();const list=lastState?.tabs||[],i=list.findIndex(t=>t.active);if(list.length>1)window.qbitBrowser.selectTab(list[(i+(e.shiftKey?-1:1)+list.length)%list.length].id);}});
window.qbitBrowser.onState(state);renderBookmarks();if(localStorage.getItem("qbit-bookmarks-bar-hidden")==="true")$("bookmarks").style.display="none";a.focus();})();
