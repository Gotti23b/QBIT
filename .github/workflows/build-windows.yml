name: Build QBIT for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app.js"
      - "index.html"
      - "styles.css"
      - "qbit-icon.svg"
      - "electron/**"
      - "config/package.json"
      - ".github/workflows/build-windows.yml"

concurrency:
  group: qbit-windows-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: config/package.json

      - name: Install Wine for Windows packaging
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y wine64 wine32

      - name: Prepare Windows app folder
        shell: bash
        run: |
          mkdir -p desktop-build
          cp index.html app.js styles.css qbit-icon.svg desktop-build/
          cp -R electron desktop-build/
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('config/package.json','utf8')); p.main='electron/main.cjs'; p.scripts.start='electron .'; p.scripts.check='node --check electron/main.cjs && node --check electron/preload.cjs && node --check app.js'; p.build.directories.output='../dist'; fs.writeFileSync('desktop-build/package.json', JSON.stringify(p,null,2)+'\\n')"

      - name: Install Windows build dependencies
        working-directory: desktop-build
        run: npm install

      - name: Check JavaScript syntax
        working-directory: desktop-build
        run: npm run check

      - name: Build Windows installer
        working-directory: desktop-build
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: QBIT-Windows-Installer
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 7
