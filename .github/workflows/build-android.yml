name: Build QBIT Android APK
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm --prefix config install

      - name: Prepare web app for Android
        run: |
          mkdir -p config/www
          cp index.html app.js styles.css qbit-icon.svg config/www/

      - name: Generate Android project
        working-directory: config
        run: npx cap add android

      - name: Sync web app to Android
        working-directory: config
        run: npx cap sync android

      - name: Build debug APK
        working-directory: config/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QBIT-Android-APK
          path: config/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
