name: Build QBIT Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qbit-android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Capacitor
        run: |
          mkdir -p config
          npm --prefix config init -y
          npm --prefix config install @capacitor/core @capacitor/cli @capacitor/android

      - name: Prepare QBIT web app
        run: |
          mkdir -p config/www
          cp index.html app.js styles.css mascot.css mascot.js qbit-icon.svg config/www/
          printf '%s\n' '{"appId":"com.gotti23b.qbit","appName":"QBIT","webDir":"www","server":{"androidScheme":"https"}}' > config/capacitor.config.json

      - name: Generate Android project
        working-directory: config
        run: npx cap add android

      - name: Install QBIT Android control service
        run: |
          set -e
          JAVA_DIR="config/android/app/src/main/java/com/gotti23b/qbit"
          mkdir -p "$JAVA_DIR" config/android/app/src/main/res/xml
          cp android-native/QBITControlPlugin.java "$JAVA_DIR/"
          cp android-native/QBITAccessibilityService.java "$JAVA_DIR/"
          cp android-native/qbit_accessibility_service.xml config/android/app/src/main/res/xml/
          python3 <<'PY'
          from pathlib import Path
          main = Path("config/android/app/src/main/java/com/gotti23b/qbit/MainActivity.java")
          source = main.read_text()
          if "QBITControlPlugin" not in source:
              source = source.replace("import com.getcapacitor.BridgeActivity;", "import com.getcapacitor.BridgeActivity;\nimport com.gotti23b.qbit.QBITControlPlugin;")
              source = source.replace("public class MainActivity extends BridgeActivity {", "public class MainActivity extends BridgeActivity {\n    @Override\n    public void onCreate(android.os.Bundle savedInstanceState) {\n        registerPlugin(QBITControlPlugin.class);\n        super.onCreate(savedInstanceState);\n    }")
              main.write_text(source)
          manifest = Path("config/android/app/src/main/AndroidManifest.xml")
          source = manifest.read_text()
          service = """
              <service
                  android:name=".QBITAccessibilityService"
                  android:label="QBIT Control"
                  android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                  android:exported="true">
                  <intent-filter>
                      <action android:name="android.accessibilityservice.AccessibilityService" />
                  </intent-filter>
                  <meta-data
                      android:name="android.accessibilityservice"
                      android:resource="@xml/qbit_accessibility_service" />
              </service>
          """
          if "android.permission.WRITE_SETTINGS" not in source:
              source = source.replace("<application", '<uses-permission android:name="android.permission.WRITE_SETTINGS" />\n    <application', 1)
          if "QBITAccessibilityService" not in source:
              source = source.replace("</application>", service + "\n    </application>")
          manifest.write_text(source)
          PY

      - name: Generate QBIT app icons
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          mkdir -p config/resources
          rsvg-convert -w 1024 -h 1024 qbit-icon.svg -o config/resources/icon-only.png
          sed '/<rect width="64" height="64" rx="15" fill="#07111f"\/>/d' qbit-icon.svg > /tmp/qbit-foreground.svg
          rsvg-convert -w 1024 -h 1024 /tmp/qbit-foreground.svg -o config/resources/icon-foreground.png
          printf '%s\n' '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024"><rect width="1024" height="1024" fill="#07111f"/></svg>' > /tmp/qbit-background.svg
          rsvg-convert -w 1024 -h 1024 /tmp/qbit-background.svg -o config/resources/icon-background.png

      - name: Apply QBIT version
        run: |
          node <<'NODE'
          const fs = require('fs');
          const pkg = require('./package.json');
          const gradlePath = 'config/android/app/build.gradle';
          let gradle = fs.readFileSync(gradlePath, 'utf8');
          const [major, minor, patch] = pkg.version.split('.').map(Number);
          const versionCode = major * 1000000 + minor * 1000 + patch;
          gradle = gradle.replace(/versionCode\s+\d+/, 'versionCode ' + versionCode);
          gradle = gradle.replace(/versionName\s+"[^"]+"/, 'versionName "' + pkg.version + '"');
          fs.writeFileSync(gradlePath, gradle);
          console.log('Building QBIT ' + pkg.version + ' (versionCode ' + versionCode + ')');
          NODE

      - name: Generate Android launcher icons
        working-directory: config
        run: npx --yes @capacitor/assets generate --android --assetPath resources --androidProject android

      - name: Sync web app
        working-directory: config
        run: npx cap sync android

      - name: Build debug APK
        working-directory: config/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Read Android release version
        id: release_version
        run: |
      VERSION=$(node -p "require('./package.json').version")
      echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: cp config/android/app/build/outputs/apk/debug/app-debug.apk "QBIT-Android-v${{ steps.release_version.outputs.version }}.apk"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: QBIT-Android-v${{ github.sha }}
          path: QBIT-Android-v${{ steps.release_version.outputs.version }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish dedicated Android GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ steps.release_version.outputs.version }}
          name: QBIT Android v${{ steps.release_version.outputs.version }}
          body: |
            APK de QBIT para Android.
            Las releases Android usan etiquetas `android-v*` y se mantienen separadas de las releases de Windows.
          files: QBIT-Android-v${{ steps.release_version.outputs.version }}.apk
          make_latest: false
          fail_on_unmatched_files: true
